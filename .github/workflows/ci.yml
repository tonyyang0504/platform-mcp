name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Python dependencies (the hub in editable mode, the MCP SDK pinned)
        run: python -m pip install -q "mcp==2.2.0" -e ".[dev]"
      - name: Versions agree (pyproject, Python package, npm package)
        run: |
          python - <<'EOF'
          import json, re, tomllib
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("runtime/python/platform_mcp_hub/__init__.py").read())[1]
          npm = json.load(open("runtime/typescript/package.json"))["version"]
          ts = re.search(r'VERSION = "([^"]+)"', open("runtime/typescript/src/version.ts").read())[1]
          assert py == init == npm == ts, (py, init, npm, ts)
          print("version", py)
          EOF
      - name: Catalog lint
        run: python -m platform_mcp_hub lint
      - name: Regenerate registry metadata, index and directory snapshot
        run: python tools/gen_all.py
      - name: Generated files must be committed
        run: |
          if ! git diff --exit-code --stat -- servers catalog runtime/python/README.md; then
            echo "generated files are stale; run python tools/gen_all.py and commit"
            exit 1
          fi
      - name: Build the TypeScript runtime
        run: cd runtime/typescript && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Python tests
        run: python -m pytest -q tests
      - name: TypeScript tests (contract tests and parity with the Python CLI)
        env:
          PYTHON: python
        run: node --test tests/*.test.mjs
      - name: Installed packages (wheel and npm tarball) over stdio, outside the checkout
        run: |
          python -m build -q -o /tmp/dist .
          (cd runtime/typescript && npm pack --pack-destination /tmp/dist)
          python -m venv /tmp/v && /tmp/v/bin/pip install -q /tmp/dist/*.whl
          mkdir -p /tmp/npmhub && cd /tmp/npmhub && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund /tmp/dist/platform-mcp-hub-*.tgz
          cd /tmp
          /tmp/v/bin/platform-mcp-hub describe reed > /dev/null
          python "$GITHUB_WORKSPACE/tools/smoke_stdio.py" "/tmp/v/bin/platform-mcp-hub serve reed" "/tmp/v/bin/platform-mcp-hub directory" \
            "/tmp/npmhub/node_modules/.bin/platform-mcp-hub serve reed" "/tmp/npmhub/node_modules/.bin/platform-mcp-hub directory"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: /tmp/dist/, retention-days: 7 }

  python-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -q "mcp==2.2.0" -e ".[dev]"
      - run: python -m pytest -q tests
